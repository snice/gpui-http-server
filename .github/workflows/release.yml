name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            formats: dmg
          - name: macOS (Intel)
            os: macos-15-intel
            target: x86_64-apple-darwin
            formats: dmg
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang cmake \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig-dev libfreetype-dev libssl-dev libasound2-dev \
            libvulkan-dev mesa-vulkan-drivers libfuse2 patchelf file

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Disable Spotlight indexing (avoids busy dmg volumes)
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true

      - name: Package
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cargo packager --release --formats ${{ matrix.formats }} --target ${{ matrix.target }}; then
              exit 0
            fi
            echo "Packaging failed (attempt $attempt), cleaning up and retrying..."
            if [ "$RUNNER_OS" = "macOS" ]; then
              for dev in $(hdiutil info | grep -o '/dev/disk[0-9]*' | sort -u); do
                hdiutil detach -force "$dev" || true
              done
              rm -f dist/rw.*.dmg
            fi
            sleep 5
          done
          exit 1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.deb
            dist/*.AppImage

  release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
