[package]
name = "http-server"
version = "0.1.0"
edition = "2024"
description = "A tiny desktop app to serve static HTML folders, built with gpui-kit."

[dependencies]
gpui-kit = "0.9.0"
anyhow = "1"
tiny_http = "0.12"
mime_guess = "2"
percent-encoding = "2"
qrcode = { version = "0.14", default-features = false }
local-ip-address = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[package.metadata.packager]
product-name = "Static Server"
identifier = "com.example.static-server"
authors = ["Static Server"]
category = "DeveloperTool"
out-dir = "dist"
before-packaging-command = "cargo build --release"
icons = ["icons/icon.png", "icons/icon.icns", "icons/icon.ico"]
